set -g mode-keys vi
set -g mouse on

# Keep the stock pane context menu, with explicit mouse tracking and click-to-select.
bind-key  -T root MouseDown3Pane            if-shell -F -t = "#{||:#{mouse_any_flag},#{&&:#{pane_in_mode},#{?#{m/r:(copy|view)-mode,#{pane_mode}},0,1}}}" { select-pane -t = ; send-keys -M } { display-menu -M -O -T "#[align=centre]#{pane_index} (#{pane_id})" -t = -x M -y M "#{?#{m/r:(copy|view)-mode,#{pane_mode}},Go To Top,}" < { send-keys -X history-top } "#{?#{m/r:(copy|view)-mode,#{pane_mode}},Go To Bottom,}" > { send-keys -X history-bottom } '' "#{?#{&&:#{buffer_size},#{!:#{pane_in_mode}}},Paste #[underscore]#{=/9/...:buffer_sample},}" p { paste-buffer } '' "#{?mouse_word,Search For #[underscore]#{=/9/...:mouse_word},}" C-r { if-shell -F "#{?#{m/r:(copy|view)-mode,#{pane_mode}},0,1}" "copy-mode -t=" ; send-keys -X -t = search-backward -- "#{q:mouse_word}" } "#{?mouse_word,Type #[underscore]#{=/9/...:mouse_word},}" C-y { copy-mode -q ; send-keys -l "#{q:mouse_word}" } "#{?mouse_word,Copy #[underscore]#{=/9/...:mouse_word},}" c { copy-mode -q ; set-buffer "#{q:mouse_word}" } "#{?mouse_line,Copy Line,}" l { copy-mode -q ; set-buffer "#{q:mouse_line}" } '' "#{?mouse_hyperlink,Type #[underscore]#{=/9/...:mouse_hyperlink},}" C-h { copy-mode -q ; send-keys -l "#{q:mouse_hyperlink}" } "#{?mouse_hyperlink,Copy #[underscore]#{=/9/...:mouse_hyperlink},}" h { copy-mode -q ; set-buffer "#{q:mouse_hyperlink}" } '' "#{?#{!:#{pane_floating_flag}},Horizontal Split,}" h { split-window -h } "#{?#{!:#{pane_floating_flag}},Vertical Split,}" v { split-window -v } '' "#{?#{&&:#{!:#{pane_floating_flag}},#{>:#{window_panes},1}},Swap Up,}" u { swap-pane -U } "#{?#{&&:#{!:#{pane_floating_flag}},#{>:#{window_panes},1}},Swap Down,}" d { swap-pane -D } "#{?pane_marked_set,,-}Swap Marked" s { swap-pane } '' Kill X { kill-pane } Respawn R { respawn-pane -k } "#{?pane_marked,Unmark,Mark}" m { select-pane -m } "#{?#{>:#{window_panes},1},,-}#{?window_zoomed_flag,Unzoom,Zoom}" z { resize-pane -Z } }
bind-key  -T root MouseDown3Status          display-menu -M -O -T "#[align=centre]#{window_index}:#{window_name}" -t = -x W -y W "#{?#{>:#{session_windows},1},,-}Swap Left" l { swap-window -t :-1 } "#{?#{>:#{session_windows},1},,-}Swap Right" r { swap-window -t :+1 } "#{?pane_marked_set,,-}Swap Marked" s { swap-window } '' Kill X { kill-window } Respawn R { respawn-window -k } "#{?pane_marked,Unmark,Mark}" m { select-pane -m } Rename n { command-prompt -F -I "#W" { rename-window -t "#{window_id}" "%%" } } '' "New After" w { new-window -a } "New At End" W { new-window }
bind-key  -T root MouseDown3StatusLeft      display-menu -M -O -T "#[align=centre]#{session_name}" -t = -x M -y W Next n { switch-client -n } Previous p { switch-client -p } '' Renumber N { move-window -r } Rename r { command-prompt -I "#S" { rename-session "%%" } } Detach d { detach-client } '' "New Session" s { new-session } "New Window" w { new-window }
set -g set-titles on
set -g focus-events on

bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind -n C-l send-keys -R C-l \; clear-history \;
bind T command-prompt -p "(rename-pane)" 'select-pane -T "%%"'

# Keep generous tmux history for long-running log inspection.
set -g history-limit 1000000
set -s buffer-limit 10000
set -s message-limit 100000
set -s prompt-history-limit 10000
set -s input-buffer-size 10485760

set -g pane-border-status top
set -g pane-border-format '#{?pane_active,#[bold],#[dim]} #{pane_index} #{pane_title} #[default]'

set -g allow-rename off
set -g allow-set-title off

setw -g automatic-rename on
setw -g automatic-rename-format '#{pane_current_command}'

set -sg escape-time 50
set -g status-left-length 20 

set -ag update-environment VSCODE_IPC_HOOK_CLI

set -g set-titles-string '#W'

set -gq set-clipboard on
set -gq allow-passthrough on
set -sq extended-keys on
set -asq terminal-features 'xterm*:extkeys'
set -g renumber-windows on
set -g default-terminal "tmux-256color"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-sessionist'
set -g @plugin 'tmux-plugins/tmux-logging'

# set -g @continuum-restore 'on'
if-shell '[ -x "$HOME/.tmux/plugins/tpm/tpm" ]' 'run "$HOME/.tmux/plugins/tpm/tpm"'

# theme
set -g @catppuccin_window_text "#W"
set -g @catppuccin_window_current_text "#W"
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_date_time_icon "󱑒 "
set -g @catppuccin_date_time_text " %H:%M:%S"

if-shell '[ -r "$HOME/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux" ] && tmux -V | awk '"'"'{ split($2, v, /[^0-9]+/); exit !((v[1] > 3) || (v[1] == 3 && v[2] >= 5)) }'"'"'' \
  'run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux; \
   set -g status-right-length 100; \
   set -g status-left-length 100; \
   set -g status-left ""; \
   set -g status-right "#{E:@catppuccin_status_application}"; \
   set -ag status-right "#{E:@catppuccin_status_session}"; \
   set -ag status-right "#{E:@catppuccin_status_date_time}"' \
  'set -g status-right-length 100; \
   set -g status-left-length 100; \
   set -g status-left ""; \
   set -g status-right "#S #[fg=colour245]| %H:%M:%S"'
set -g status-interval 1

# Don’t tint the whole copy-mode screen (this is what made selection “disappear”)
set -wgq mode-style "default"
set -wgq copy-mode-selection-style "bg=colour254,fg=colour232,bold"

# tmux 3.7b prompt rendering workaround
%if #{m/r:^3\.7b$,#{version}}
    set -g message-style 'fg=#94e2d5,bg=#181825,fill=#181825,align=left,width=100%'
    set -g message-command-style 'fg=#94e2d5,bg=#181825,fill=#181825,align=left,width=100%'
%endif
